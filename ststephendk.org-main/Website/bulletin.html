<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parish Bulletin - St. Stephen Catholic Church, Darkuman</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="site-header"></div>

    <section class="hero" style="background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('images/church-hero.jpg') no-repeat center center/cover; padding: 6rem 0;">
        <div class="hero-content">
            <h2>Parish Weekly Bulletin</h2>
            <p>Stay informed about parish activities and announcements</p>
        </div>
    </section>

    <section class="content-section">
        <div class="container">
            <div class="section-intro">
                <h2>View the Weekly Bulletin</h2>
                <p>Open the latest parish bulletin as a PDF, and download previous bulletins from the archive.</p>
            </div>

            <div class="content-stack">
                <div class="content-card">
                    <h3>Current Bulletin</h3>
                    <div class="pdf-toolbar">
                        <div class="pdf-toolbar-left">
                            <strong id="current-bulletin-title">No bulletin selected</strong>
                        </div>
                        <div class="pdf-toolbar-right">
                            <a id="current-bulletin-open" class="btn btn-sm" href="#" target="_blank" rel="noopener" aria-disabled="true">Open</a>
                            <a id="current-bulletin-download" class="btn btn-sm" href="#" download aria-disabled="true">Download</a>
                        </div>
                    </div>
                    <div class="pdf-viewer">
                        <iframe id="bulletin-pdf" title="Parish Bulletin PDF Viewer" src="about:blank"></iframe>
                    </div>
                </div>

                <div class="content-card">
                    <h3>Bulletin Archive</h3>
                    <div id="bulletin-archive" class="archive-grid"></div>
                </div>
            </div>
        </div>
    </section>

    <div id="site-footer"></div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const viewer = document.getElementById('bulletin-pdf');
            const archiveHost = document.getElementById('bulletin-archive');
            const currentTitle = document.getElementById('current-bulletin-title');
            const currentOpen = document.getElementById('current-bulletin-open');
            const currentDownload = document.getElementById('current-bulletin-download');

            if (!viewer || !archiveHost || !currentTitle || !currentOpen || !currentDownload) {
                return;
            }

            const bulletinBasePath = 'Bulletin/';
            const embeddedBulletins = [
                { title: 'BULLETIN 10TH MAY, 2026 (YEAR A)', date: '2026-05-10', fileName: 'BULLETIN 10TH MAY, 2026 (YEAR A).pdf' },
                { title: 'BULLETIN  3RD MAY, 2026 (YEAR A)', date: '2026-05-03', fileName: 'BULLETIN  3RD MAY, 2026 (YEAR A).pdf' },
                { title: 'BULLETIN  26TH APRIL, 2026 (YEAR A)', date: '2026-04-26', fileName: 'BULLETIN  26TH APRIL, 2026 (YEAR A).pdf' },
                { title: 'BULLETIN 1ST SEPTEMBER, 2024 (YEAR B)', date: '2024-09-01', fileName: 'BULLETIN 1ST SEPTEMBER, 2024 (YEAR B).pdf' },
                { title: 'BULLETIN 1ST SEPTEMBER^J 2024 (YEAR B)', date: '2024-09-01', fileName: 'BULLETIN 1ST SEPTEMBER^J 2024 (YEAR B).pdf' }
            ];

            function setDisabled(link, isDisabled) {
                link.setAttribute('aria-disabled', isDisabled ? 'true' : 'false');
                if (isDisabled) {
                    link.classList.add('is-disabled');
                    link.href = '#';
                    link.removeAttribute('download');
                } else {
                    link.classList.remove('is-disabled');
                }
            }

            function buildBulletinUrl(fileName) {
                return bulletinBasePath + encodeURIComponent(fileName);
            }

            function setCurrentBulletin(entry) {
                if (!entry) {
                    viewer.src = 'about:blank';
                    currentTitle.textContent = 'No bulletin selected';
                    setDisabled(currentOpen, true);
                    setDisabled(currentDownload, true);
                    return;
                }

                viewer.src = entry.url;
                currentTitle.textContent = entry.title + (entry.date ? ' — ' + entry.date : '');
                currentOpen.href = entry.url;
                currentOpen.setAttribute('target', '_blank');
                currentOpen.setAttribute('rel', 'noopener');
                setDisabled(currentOpen, false);
                currentDownload.href = entry.url;
                currentDownload.setAttribute('download', '');
                setDisabled(currentDownload, false);
            }

            function renderArchive(bulletins) {
                if (!bulletins || !bulletins.length) {
                    archiveHost.innerHTML = '<p class="event-empty">No bulletins available yet.</p>';
                    return;
                }

                const sorted = bulletins.slice().sort(function(a, b) {
                    return String(b.date).localeCompare(String(a.date));
                });

                archiveHost.innerHTML = sorted.map(function(item) {
                    const safeTitle = item.title.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const safeDate = item.date.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const safeUrl = item.url.replace(/"/g, '&quot;');
                    return (
                        '<button type="button" class="archive-card" data-url="' + safeUrl + '" data-title="' + safeTitle + '" data-date="' + safeDate + '">' +
                            '<div class="archive-card-top">' +
                                '<div class="archive-card-title">' + safeTitle + '</div>' +
                                '<div class="archive-card-date">' + safeDate + '</div>' +
                            '</div>' +
                            '<div class="archive-card-actions">' +
                                '<span class="event-badge">View</span>' +
                                '<span class="event-badge">PDF</span>' +
                            '</div>' +
                        '</button>'
                    );
                }).join('');

                archiveHost.querySelectorAll('.archive-card').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        const entry = {
                            title: btn.getAttribute('data-title') || 'Bulletin',
                            date: btn.getAttribute('data-date') || '',
                            url: btn.getAttribute('data-url') || ''
                        };
                        setCurrentBulletin(entry);
                    });
                });

                setCurrentBulletin(sorted[0]);
            }

            function normalize(list) {
                return (list || [])
                    .filter(function(item) {
                        return item && item.fileName;
                    })
                    .map(function(item) {
                        return {
                            title: item.title || item.fileName,
                            date: item.date || '',
                            url: buildBulletinUrl(item.fileName)
                        };
                    });
            }

            fetch('Bulletin/bulletins.json', { cache: 'no-store' })
                .then(function(res) {
                    if (!res.ok) {
                        throw new Error('Failed to load bulletin list');
                    }
                    return res.json();
                })
                .then(function(data) {
                    const list = Array.isArray(data) ? data : (Array.isArray(data.bulletins) ? data.bulletins : []);
                    renderArchive(normalize(list));
                })
                .catch(function() {
                    renderArchive(normalize(embeddedBulletins));
                });
        });
    </script>
</body>
</html>
